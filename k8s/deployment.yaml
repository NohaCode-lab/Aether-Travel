apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-travel-app
  namespace: default
  labels:
    app: aether-travel
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aether-travel
  template:
    metadata:
      labels:
        app: aether-travel
    spec:
      containers:
        - name: frontend
          image: aethertravel/frontend:v1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-travel-backend
  namespace: default
  labels:
    app: aether-travel-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aether-travel-backend
  template:
    metadata:
      labels:
        app: aether-travel-backend
    spec:
      containers:
        - name: backend
          image: aethertravel/backend:v1.0.0
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: aether-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
