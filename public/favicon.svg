<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon/Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#bgGrad)" />
  
  <!-- Outer Orbital Flight Path Ring -->
  <ellipse cx="50" cy="50" rx="36" ry="16" transform="rotate(-30 50 50)" stroke="url(#ringGrad)" stroke-width="3.5" stroke-dasharray="6 4" />
  
  <!-- Mini Orbiting Airplane Icon -->
  <path d="M78 30 L84 28 L82 34 L76 32 Z" fill="#38bdf8" filter="url(#glow)" />

  <!-- Central Compass Rose / AI Starburst -->
  <g filter="url(#glow)">
    <!-- Vertical & Horizontal Compass Points -->
    <path d="M50 16 L56 44 L50 50 L44 44 Z" fill="url(#starGrad)" />
    <path d="M50 84 L56 56 L50 50 L44 56 Z" fill="url(#starGrad)" opacity="0.85" />
    <path d="M84 50 L56 56 L50 50 L56 44 Z" fill="url(#starGrad)" opacity="0.9" />
    <path d="M16 50 L44 56 L50 50 L44 44 Z" fill="url(#starGrad)" opacity="0.8" />

    <!-- Diagonal Accent Points -->
    <path d="M50 50 L68 32 L56 44 Z" fill="#38bdf8" />
    <path d="M50 50 L32 68 L44 56 Z" fill="#34d399" />
    
    <!-- Core Gem -->
    <circle cx="50" cy="50" r="5" fill="#0f172a" />
    <circle cx="50" cy="50" r="3" fill="#38bdf8" />
  </g>
</svg>
